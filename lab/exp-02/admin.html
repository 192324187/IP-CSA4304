<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Hotel Admin Panel</h1>
</header>

<section class="admin">

    <div class="card">
        <h2>Room Management</h2>
        <p>Update room quantity and prices.</p>
        <button>Manage Rooms</button>
    </div>

    <div class="card">
        <h2>Booking Management</h2>
        <p>Modify or cancel customer bookings.</p>
        <button>Manage Bookings</button>
    </div>

    <div class="card">
        <h2>Hotel Information</h2>
        <p>Update About Us and Contact information.</p>
        <button>Update Information</button>
    </div>

</section>

</body>
</html>
